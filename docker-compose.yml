services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/secondchance
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      UPLOAD_DIR: uploads
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mongo_data:
  uploads:
