name: CICD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test-and-seed:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: secondchance_ci
      JWT_SECRET: ci-only-secret-not-used-outside-this-run
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests (including MongoDB-backed API integration)
        run: npm test
      - name: Seed and confirm exactly 16 items
        run: npm run seed
      - name: Build Docker image
        run: docker build -t secondchance-capstone .
